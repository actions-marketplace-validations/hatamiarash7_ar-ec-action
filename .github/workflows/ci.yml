name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint shell script
        run: shellcheck entrypoint.sh

      - name: Check shell formatting
        run: docker run --rm -v "$PWD:/mnt" -w /mnt mvdan/shfmt:v3 --diff entrypoint.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Lint workflows and action metadata
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: docker build --tag ar-ec-action:ci .

      - name: Verify the CLI is installed
        run: docker run --rm --entrypoint /usr/local/bin/arvan ar-ec-action:ci version

      - name: Verify required inputs are enforced
        run: |
          if docker run --rm ar-ec-action:ci; then
            echo "::error::The action should fail when no input is provided"
            exit 1
          fi

      # Exercises the happy path (outputs, job summary) against a stub CLI,
      # so the deployment API is never contacted.
      - name: Verify a successful deployment with a stub CLI
        run: |
          set -euo pipefail

          workspace="$(mktemp -d)"
          echo 'addEventListener("fetch", (e) => e.respondWith(new Response("ok")));' > "${workspace}/bundle.js"

          # The stub script is written literally: its "$1" belongs to the
          # stub's own shell, not to this one.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'if [ "${1:-}" = "version" ]; then echo "arvan stub 0.0.0"; exit 0; fi' \
            'echo "ID: ci-deployment-id"' \
            'echo "Status: pending"' \
            'echo "Created At: 2026-01-01T00:00:00Z"' \
            > "${workspace}/stub-arvan"
          chmod +x "${workspace}/stub-arvan"

          docker run --rm \
            -v "${workspace}:/github/workspace" \
            -w /github/workspace \
            -e ARVAN_API_KEY="not-a-real-token" \
            -e ARVAN_APP="ci-smoke-test" \
            -e ARVAN_FILE="bundle.js" \
            -e ARVAN_BIN="/github/workspace/stub-arvan" \
            -e GITHUB_OUTPUT="/github/workspace/outputs.txt" \
            -e GITHUB_STEP_SUMMARY="/github/workspace/summary.md" \
            ar-ec-action:ci

          grep -q '^id=ci-deployment-id$' "${workspace}/outputs.txt"
          grep -q '^status=pending$' "${workspace}/outputs.txt"
          grep -q '^created-at=2026-01-01T00:00:00Z$' "${workspace}/outputs.txt"
          grep -q 'ci-deployment-id' "${workspace}/summary.md"

  integration:
    name: Run the action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create a bundle
        run: |
          mkdir -p dist
          echo 'addEventListener("fetch", (e) => e.respondWith(new Response("ok")));' > dist/bundle.js

      # A missing bundle must fail fast, before any call to the API.
      - name: Deploy a bundle that does not exist
        id: missing
        continue-on-error: true
        uses: ./
        with:
          auth: not-a-real-token
          app: ci-smoke-test
          file: does-not-exist.js

      - name: Assert the deployment failed
        run: |
          if [ "${{ steps.missing.outcome }}" != "failure" ]; then
            echo "::error::Expected the action to fail for a missing bundle file"
            exit 1
          fi
